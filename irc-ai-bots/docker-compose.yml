services:

  # ---------------------------------------------------------------------------
  # Bot: Sage — wise, calm, uses grok
  # ---------------------------------------------------------------------------
  sage:
    build: .
    image: irc-ai-bot:latest
    container_name: irc-bot-sage
    restart: unless-stopped
    environment:
      BOT_NAME: sage
      CONFIG_FILE: /app/config.yaml
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

