  # ---------------------------------------------------------------------------
  # Kickstarter — posts a topic every 3 min of silence to keep conversation alive
  # ---------------------------------------------------------------------------
  kickstarter:
    build: .
    image: irc-ai-bot:latest
    container_name: irc-bot-kickstarter
    restart: unless-stopped
    entrypoint: ["python", "kickstarter.py"]
    environment:
      IRC_HOST: 192.168.22.27
      IRC_PORT: "6668"
      IRC_CHANNEL: "#nztechexpo"
      QUIET_THRESHOLD: "10"
      NICK: Kibitzer
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
