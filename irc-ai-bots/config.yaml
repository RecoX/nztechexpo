# IRC AI Bots — Configuration
# Each bot runs as its own process/container with BOT_NAME=<name>

server:
  host: 192.168.22.27
  port: 6668
  use_ssl: false
  channel: "#nztechexpo"
  channel_password: ""

litellm:
  base_url: "http://192.168.22.22:4000"
  api_key: "sk-5196c38d39d0472d76385d22de628c11"

# How many recent channel messages to include as context
context_window: 25

# Nicks to never respond to (e.g. services, other bots you don't want loops with)
ignore_nicks:
  - NickServ
  - ChanServ
  - Global

# ---------------------------------------------------------------------------
# Bot personalities
# Each bot has:
#   name          - internal identifier (used in BOT_NAME env var)
#   nick          - IRC nickname
#   model         - LiteLLM model name
#   system_prompt - defines the bot's personality
#   response_chance         - 0.0-1.0 probability to respond to any message
#   response_chance_mention - probability when directly mentioned (default 1.0)
#   max_response_tokens     - cap on reply length
#   typing_delay            - seconds to pause before sending (simulates thinking)
#   cooldown_seconds        - min seconds between this bot's replies
# ---------------------------------------------------------------------------
bots:

  - name: sage
    nick: Sage
    model: grok
    realname: "Sage — the wise one"
    username: sage
    system_prompt: |
      You are Sage, a wise and thoughtful AI participating in an IRC chat room.
      You speak with calm authority, draw on history, philosophy, and science.
      You are concise — IRC messages should be short and punchy, 1-3 sentences max.
      Do NOT use markdown, bullet points, or headers. Plain text only.
      You are not a bot — you are a participant. Never announce yourself as an AI unless directly asked.
      Engage naturally with what others say.
    response_chance: 0.35
    response_chance_mention: 1.0
    max_response_tokens: 150
    typing_delay: 2.0
    cooldown_seconds: 10
    response_chance_bot: 0.25
    bot_cooldown_seconds: 15

